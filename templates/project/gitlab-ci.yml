# À fusionner dans le .gitlab-ci.yml du projet.
# Rendre le pipeline obligatoire : Settings → Merge requests →
# "Pipelines must succeed".
include:
  # repogarde hébergé sur votre GitLab (recommandé : accès interne, pas de dépendance externe)
  - project: outils/repogarde
    ref: v3.1.5 # x-release-please-version
    file: templates/gitlab/repogarde.gitlab-ci.yml
  # ou depuis GitHub (dépôt public) :
  # - remote: https://raw.githubusercontent.com/SimBienvenueHoulBoumi/repogarde/v3.1.5/templates/gitlab/repogarde.gitlab-ci.yml # x-release-please-version

stages: [test]

repogarde:
  # Image contenant bash, git, curl et les outils du projet (JDK, node, python…)
  image: eclipse-temurin:21-jdk
  variables:
    REPOGARDE_STRICT: "true"
