# Vérifications githooks en CI (obligatoires pour merger : à déclarer en
# "required status check" dans les règles de protection de la branche).
name: githooks

on:
  pull_request:
    # edited : revérifie quand le titre de la PR change (message du commit en squash)
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  githooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet : messages de commit, diff depuis la base

      # Outils du projet nécessaires au formatage et aux tests, ex. :
      # - uses: actions/setup-java@v4
      #   with: { distribution: temurin, java-version: 21, cache: maven }
      # - uses: actions/setup-node@v4
      #   with: { node-version: lts/*, cache: npm }
      # - run: npm ci

      - uses: SimBienvenueHoulBoumi/githooks@v1 # x-release-please-major
        with:
          strict: true
