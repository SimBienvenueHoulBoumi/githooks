# Releases automatiques : à chaque merge sur main, la version (semver) est
# calculée depuis les Conventional Commits, une PR « release x.y.z » (changelog,
# version du projet) est validée par la CI puis mergée, et le tag vX.Y.Z et la
# release GitHub sont créés. Aucun jeton à créer.
#
# Prérequis : Settings → Actions → General → Workflow permissions →
# « Allow GitHub Actions to create and approve pull requests ».
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une release à la fois
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    uses: SimBienvenueHoulBoumi/repogarde/.github/workflows/release-auto.yml@v3 # x-release-please-major
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: write
    # Optionnel :
    # with:
    #   release-type: maven          # sinon détecté (pom.xml, package.json, pyproject.toml…)
    #   workflows: repogarde.yml     # sinon les workflows pull_request + workflow_dispatch
    #   merge-auto: false            # PR de release mergée par un humain
    # Optionnel : bot de release (GitHub App, jamais bloqué : repogarde/bin/bot-release)
    # et canal de l'équipe (gh secret set REPOGARDE_WEBHOOK)
    # secrets:
    #   app-id: ${{ secrets.REPOGARDE_APP_ID }}
    #   app-key: ${{ secrets.REPOGARDE_APP_KEY }}
    #   webhook: ${{ secrets.REPOGARDE_WEBHOOK }}

  # Paquet npm à chaque release, sans jeton (mise en place : repogarde/bin/npm-publication) :
  # npm:
  #   needs: release
  #   if: vars.REPOGARDE_NPM == 'true' && (needs.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
  #   uses: SimBienvenueHoulBoumi/repogarde/.github/workflows/npm-publish.yml@v3 # x-release-please-major
  #   permissions: { contents: read, id-token: write }
  #   with:
  #     tag: ${{ needs.release.outputs.tag_name }}
  #   secrets:
  #     npm-token: ${{ secrets.NPM_TOKEN }} # première publication seulement

  # Publication propre au projet, après une release (exemple). L'environnement
  # « production » (bin/proteger --environnement production) fait attendre
  # l'approbation d'une personne désignée avant de publier :
  # publier:
  #   needs: release
  #   if: needs.release.outputs.release_created == 'true'
  #   environment: production
  #   runs-on: ubuntu-latest
  #   steps:
  #     - run: echo "Publier ${{ needs.release.outputs.tag_name }}"
