# Releases automatiques : à chaque merge sur main, la version (semver) est
# calculée depuis les Conventional Commits, une PR « release x.y.z » (changelog,
# version du projet) est validée par la CI puis mergée, et le tag vX.Y.Z et la
# release GitHub sont créés. Aucun jeton à créer.
#
# Prérequis : Settings → Actions → General → Workflow permissions →
# « Allow GitHub Actions to create and approve pull requests ».
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une release à la fois
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    uses: SimBienvenueHoulBoumi/repogarde/.github/workflows/release-auto.yml@v2 # x-release-please-major
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: write
    # Optionnel :
    # with:
    #   release-type: maven          # sinon détecté (pom.xml, package.json, pyproject.toml…)
    #   workflows: repogarde.yml     # sinon les workflows pull_request + workflow_dispatch

  # Publication propre au projet, après une release (exemple) :
