# Template GitLab CI : mêmes règles que les hooks repogarde, en CI (non contournable).
#
# Dans le .gitlab-ci.yml du projet :
#
#   include:
#     # repogarde hébergé sur votre GitLab (recommandé) :
#     - project: outils/repogarde
#       ref: v3.1.4 # x-release-please-version
#       file: templates/gitlab/repogarde.gitlab-ci.yml
#     # ou depuis GitHub (dépôt public) :
#     # - remote: https://raw.githubusercontent.com/SimBienvenueHoulBoumi/repogarde/v1.0.0/templates/gitlab/repogarde.gitlab-ci.yml
#
#   repogarde:
#     image: votre-image-avec-les-outils-du-projet  # JDK, node, python…
#
# Variables surchargeables : REPOGARDE_URL, REPOGARDE_REF, REPOGARDE_CHECKS,
# REPOGARDE_STRICT, GITLEAKS_VERSION. Prérequis de l'image : bash, git, curl.
#
# Linters (optionnel) : REPOGARDE_MEGALINTER: "true" ajoute le job
# repogarde-megalinter (MegaLinter, fichiers modifiés, config .mega-linter.yml).

.repogarde:
  stage: test
  variables:
    GIT_DEPTH: "0"
    REPOGARDE_URL: https://github.com/SimBienvenueHoulBoumi/repogarde.git
    REPOGARDE_REF: v3.1.4 # x-release-please-version
    REPOGARDE_CHECKS: commits branch secrets format tests deadcode
    REPOGARDE_STRICT: "false"
    GITLEAKS_VERSION: 8.30.1
    REPOGARDE_BIN: $CI_PROJECT_DIR/.repogarde-bin
  script:
    - git clone --quiet --depth 1 --branch "$REPOGARDE_REF" "$REPOGARDE_URL" /tmp/repogarde
    - case " $REPOGARDE_CHECKS " in *" secrets "*) bash /tmp/repogarde/ci/install-tool.sh gitleaks ;; esac
    - bash /tmp/repogarde/ci/check.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

repogarde:
  extends: .repogarde

repogarde-megalinter:
  stage: test
  image: oxsecurity/megalinter:v10.1.0
  variables:
    GIT_DEPTH: "0"
    DEFAULT_WORKSPACE: $CI_PROJECT_DIR
    VALIDATE_ALL_CODEBASE: "false"
  # MegaLinter s'exécute dans le point d'entrée de l'image
  script: ["true"]
  rules:
    - if: $REPOGARDE_MEGALINTER == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $REPOGARDE_MEGALINTER == "true" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $REPOGARDE_MEGALINTER == "true" && $CI_COMMIT_BRANCH
