# Template GitLab CI : mêmes règles que les hooks githooks, en CI (non contournable).
#
# Dans le .gitlab-ci.yml du projet :
#
#   include:
#     # githooks hébergé sur votre GitLab (recommandé) :
#     - project: outils/githooks
#       ref: v1.0.0 # x-release-please-version
#       file: templates/gitlab/githooks.gitlab-ci.yml
#     # ou depuis GitHub (dépôt public) :
#     # - remote: https://raw.githubusercontent.com/SimBienvenueHoulBoumi/githooks/v1.0.0/templates/gitlab/githooks.gitlab-ci.yml
#
#   githooks:
#     image: votre-image-avec-les-outils-du-projet  # JDK, node, python…
#
# Variables surchargeables : GITHOOKS_URL, GITHOOKS_REF, GITHOOKS_CHECKS,
# GITHOOKS_STRICT, GITLEAKS_VERSION. Prérequis de l'image : bash, git, curl.

.githooks:
  stage: test
  variables:
    GIT_DEPTH: "0"
    GITHOOKS_URL: https://github.com/SimBienvenueHoulBoumi/githooks.git
    GITHOOKS_REF: v1.0.0 # x-release-please-version
    GITHOOKS_CHECKS: commits branch secrets format tests
    GITHOOKS_STRICT: "false"
    GITLEAKS_VERSION: 8.30.1
    GITHOOKS_BIN: $CI_PROJECT_DIR/.githooks-bin
  script:
    - git clone --quiet --depth 1 --branch "$GITHOOKS_REF" "$GITHOOKS_URL" /tmp/githooks
    - case " $GITHOOKS_CHECKS " in *" secrets "*) /tmp/githooks/ci/install-gitleaks.sh ;; esac
    - /tmp/githooks/ci/check.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

githooks:
  extends: .githooks
