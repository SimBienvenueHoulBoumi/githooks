# Config lefthook partagée : à référencer depuis le lefthook.yml d'un projet
#
#   remotes:
#     - git_url: https://github.com/SimBienvenueHoulBoumi/githooks
#       ref: v1.0.0
#       configs: [lefthook-remote.yml]
#
# Les scripts sont dans .lefthook/<hook>/githooks et relaient vers hooks/<hook>.
min_version: 2.0.0

pre-commit:
  scripts:
    githooks:
      runner: bash

prepare-commit-msg:
  scripts:
    githooks:
      runner: bash

commit-msg:
  scripts:
    githooks:
      runner: bash

pre-push:
  scripts:
    githooks:
      runner: bash
      use_stdin: true

post-checkout:
  scripts:
    githooks:
      runner: bash
