site_name: repogarde
site_description: Hooks git et CI multi-langages — messages de commit, nommage des branches, secrets, formatage, tests ciblés, releases.
site_url: https://simbienvenuehoulboumi.github.io/repogarde/
repo_url: https://github.com/SimBienvenueHoulBoumi/repogarde
repo_name: SimBienvenueHoulBoumi/repogarde
edit_uri: edit/main/docs/
copyright: Licence MIT

# Un lien cassé ou une page orpheline fait échouer la publication
strict: true

theme:
  name: material
  language: fr
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Mode clair
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link

nav:
  - Accueil: index.md
  - Démarrage rapide: demarrage.md
  - Hooks et règles: hooks.md
  - Technologies: technologies.md
  - Configuration: configuration.md
  - CI (GitHub, GitLab): ci.md
  - Versions et releases: releases.md
  - Validation humaine: validation.md
  - En organisation: industrialisation.md
  - Migration depuis githooks: migration.md
  - Désinstallation: desinstallation.md
  - Limites: limites.md
  - Sécurité: securite.md
  - Contribuer: contribuer.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  # Inclut SECURITY.md, CONTRIBUTING.md et CHANGELOG.md de la racine, sans copie
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# Liens vers une section inexistante : bloquant (avec strict)
validation:
  links:
    anchors: warn

# Fichiers de docs/ non publiés
exclude_docs: |
  requirements.txt
  requirements.in
