# Releases automatiques à partir des Conventional Commits :
# release-please tient à jour une PR "release x.y.z" (changelog + versions dans
# les templates). Son merge crée le tag vX.Y.Z et déplace le tag majeur vX.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tag majeur flottant (v1 → dernière v1.x.y) pour `uses: …/githooks@v1`
  tag-major:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Déplacer le tag majeur
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          MAJOR: v${{ needs.release-please.outputs.major }}
        run: |
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"
