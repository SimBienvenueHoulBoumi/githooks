# Releases entièrement automatiques, sans jeton personnel :
# 1. release-please tient à jour une PR "release x.y.z" (changelog + versions) ;
# 2. ce workflow déclenche la CI sur cette PR (workflow_dispatch : seul type
#    d'événement que GITHUB_TOKEN a le droit de déclencher), attend les
#    vérifications obligatoires, puis la merge (squash) ;
# 3. release-please, relancé dans le même run, crée le tag vX.Y.Z et la
#    release ; les jobs suivants déplacent le tag majeur et signent l'archive.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une release à la fois ; un nouveau push attend la fin de la précédente
concurrency:
  group: release
  cancel-in-progress: false

# Aucun droit par défaut : chaque job déclare le strict nécessaire
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write # déclencher la CI sur la PR de release
      checks: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.publish.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.publish.outputs.tag_name }}
      major: ${{ steps.release.outputs.major || steps.publish.outputs.major }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: CI sur la PR de release, puis merge
        id: merge
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # pas de checkout : dépôt explicite pour gh
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          pr="$(jq -r .number <<<"$PR_JSON")"
          branch="$(jq -r .headBranchName <<<"$PR_JSON")"
          # Commit lu sur la branche (release-please vient de la mettre à jour) ;
          # la PR peut l'afficher avec un léger retard : on attend qu'elle suive,
          # sinon le merge (--match-head-commit) serait refusé.
          sha="$(gh api "repos/$GH_REPO/commits/$branch" --jq .sha)"
          for _ in $(seq 1 30); do
            [ "$(gh pr view "$pr" --json headRefOid -q .headRefOid)" = "$sha" ] && break
            sleep 5
          done
          echo "PR #$pr ($branch @ ${sha:0:7}) : lancement de la CI"
          gh workflow run ci.yml --ref "$branch"
          # Attendre que les vérifications obligatoires apparaissent puis se terminent
          for _ in $(seq 1 30); do
            gh pr checks "$pr" --required >/dev/null 2>&1 && break
            [ "$(gh pr checks "$pr" --required --json state -q length 2>/dev/null || echo 0)" -gt 0 ] && break
            sleep 10
          done
          gh pr checks "$pr" --required --watch --interval 30
          gh pr merge "$pr" --squash --match-head-commit "$sha"
          echo "merged=true" >>"$GITHUB_OUTPUT"

      # Le merge fait par GITHUB_TOKEN ne relance pas ce workflow : on publie ici
      - id: publish
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # Tag majeur flottant (v1 → dernière v1.x.y) pour `uses: …/githooks@v1`
  tag-major:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Déplacer le tag majeur
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          MAJOR: v${{ needs.release-please.outputs.major }}
        run: |
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"

  # Archive source signée (Sigstore, sans clé) jointe à la release :
  # vérifiable avec `cosign verify-blob` (voir SECURITY.md)
  sign:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Archive signée
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          name="githooks-$TAG"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "$TAG"
          cosign sign-blob --yes --bundle "$name.tar.gz.sigstore.json" "$name.tar.gz"
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sigstore.json" --clobber
