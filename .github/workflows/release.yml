# Releases entièrement automatiques, sans jeton personnel :
# 1. release-please tient à jour une PR "release x.y.z" (changelog + versions) ;
# 2. ce workflow déclenche la CI sur cette PR (workflow_dispatch : seul type
#    d'événement que GITHUB_TOKEN a le droit de déclencher) et attend sa fin.
#    GitHub ne rattache pas ces vérifications à la PR : leur résultat réel est
#    reporté en statuts sur le commit (une vérification exigée qui n'a pas
#    réussi = rien n'est reporté ni mergé), puis la PR est mergée (squash) ;
# 3. release-please, relancé dans le même run, crée le tag vX.Y.Z et la
#    release ; les jobs suivants déplacent le tag majeur et signent l'archive.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une release à la fois ; un nouveau push attend la fin de la précédente
concurrency:
  group: release
  cancel-in-progress: false

# Aucun droit par défaut : chaque job déclare le strict nécessaire
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write # déclencher la CI sur la PR de release
      checks: read
      statuses: write # reporter le résultat de cette CI sur le commit
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.publish.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.publish.outputs.tag_name }}
      major: ${{ steps.release.outputs.major || steps.publish.outputs.major }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: CI sur la PR de release, puis merge
        id: merge
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # pas de checkout : dépôt explicite pour gh
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          pr="$(jq -r .number <<<"$PR_JSON")"
          branch="$(jq -r .headBranchName <<<"$PR_JSON")"
          # Commit lu sur la branche (release-please vient de la mettre à jour) ;
          # la PR peut l'afficher avec un léger retard : on attend qu'elle suive,
          # sinon le merge (--match-head-commit) serait refusé.
          sha="$(gh api "repos/$GH_REPO/commits/$branch" --jq .sha)"
          for _ in $(seq 1 30); do
            [ "$(gh pr view "$pr" --json headRefOid -q .headRefOid)" = "$sha" ] && break
            sleep 5
          done
          echo "PR #$pr ($branch @ ${sha:0:7}) : lancement de la CI"
          gh workflow run ci.yml --ref "$branch"
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch \
              --commit "$sha" --limit 1 --json databaseId -q '.[0].databaseId')"
            [ -n "$run_id" ] && break
            sleep 5
          done
          [ -n "$run_id" ] || { echo "✖ Run de CI introuvable"; exit 1; }
          gh run watch "$run_id" --exit-status --interval 30 >/dev/null
          run_url="$(gh run view "$run_id" --json url -q .url)"
          # Vérifications exigées par la protection de main : résultat réel de
          # chacune, reporté en statut sur le commit
          gh api "repos/$GH_REPO/rules/branches/main" \
            --jq '.[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context' |
            while IFS= read -r ctx; do
              conclusion="$(gh run view "$run_id" --json jobs \
                -q ".jobs[] | select(.name==\"$ctx\") | .conclusion")"
              if [ "$conclusion" != success ]; then
                echo "✖ $ctx : ${conclusion:-absent}"
                exit 1
              fi
              gh api "repos/$GH_REPO/statuses/$sha" -f state=success -f context="$ctx" \
                -f target_url="$run_url" -f description="CI de la PR de release" >/dev/null
              echo "✔ $ctx"
            done
          gh pr merge "$pr" --squash --match-head-commit "$sha"
          echo "merged=true" >>"$GITHUB_OUTPUT"

      # Le merge fait par GITHUB_TOKEN ne relance pas ce workflow : on publie ici
      - id: publish
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      # Le merge fait par GITHUB_TOKEN ne déclenche pas non plus le site : on le relance
      - name: Republier la documentation (changelog)
        if: steps.publish.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main

  # Tag majeur flottant (v1 → dernière v1.x.y) pour `uses: …/repogarde@v1`
  tag-major:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Déplacer le tag majeur
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          MAJOR: v${{ needs.release-please.outputs.major }}
        run: |
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"

  # Archive source signée (Sigstore, sans clé) jointe à la release :
  # vérifiable avec `cosign verify-blob` (voir SECURITY.md)
  sign:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      hashes: ${{ steps.archive.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Archive signée
        id: archive
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          name="repogarde-$TAG"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "$TAG"
          cosign sign-blob --yes --bundle "$name.tar.gz.sigstore.json" "$name.tar.gz"
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sigstore.json" --clobber
          # Empreinte de l'archive pour la preuve de provenance SLSA
          echo "hashes=$(sha256sum "$name.tar.gz" | base64 -w0)" >>"$GITHUB_OUTPUT"

  # Provenance SLSA niveau 3 : atteste que l'archive a été construite par ce
  # workflow, depuis ce dépôt et ce commit (fichier .intoto.jsonl joint à la
  # release). Générateur référencé par tag : exigé par l'outil, qui vérifie sa
  # propre identité.
  provenance:
    needs: [release-please, sign]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.sign.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.release-please.outputs.tag_name }}
      provenance-name: repogarde-${{ needs.release-please.outputs.tag_name }}.intoto.jsonl
