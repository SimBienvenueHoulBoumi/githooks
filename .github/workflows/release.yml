# Releases entièrement automatiques, sans jeton personnel : le job « release »
# (workflow réutilisable release-auto.yml, le même que pour les projets) tient
# à jour la PR de release, la fait valider par la CI, la merge et crée le tag ;
# les jobs suivants déplacent le tag majeur, signent l'archive, attestent sa
# provenance et republient la documentation.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Une release à la fois ; un nouveau push attend la fin de la précédente
concurrency:
  group: release
  cancel-in-progress: false

# Aucun droit par défaut : chaque job déclare le strict nécessaire
permissions: {}

jobs:
  # Version, changelog, PR de release validée par la CI puis mergée, tag et
  # release : workflow réutilisable, le même que celui proposé aux projets
  release:
    uses: ./.github/workflows/release-auto.yml
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: write
    with:
      # docs.yml déploierait le site depuis la branche de release : exclu
      workflows: ci.yml codeql.yml
      # repogarde s'utilise lui-même au commit publié, pas au tag v2
      repogarde-ref: ${{ github.sha }}
    # Bot de release (GitHub App) s'il est configuré : bin/bot-release
    secrets:
      app-id: ${{ secrets.REPOGARDE_APP_ID }}
      app-key: ${{ secrets.REPOGARDE_APP_KEY }}

  # Le merge fait par GITHUB_TOKEN ne déclenche pas le site : on le relance
  docs:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Republier la documentation (changelog)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --ref main

  # Paquet npm (installation sur la machine : npm install -g), publié sans
  # jeton (publication de confiance). Activé par la variable REPOGARDE_NPM ;
  # mise en place : bin/npm-publication. Le secret NPM_TOKEN ne sert qu'à la
  # toute première publication (vide ensuite : publication de confiance).
  npm:
    needs: release
    # Nouvelle release, ou lancement manuel du workflow : rattrape la dernière
    # release si elle n'est pas encore sur npm (sans effet sinon)
    if: vars.REPOGARDE_NPM == 'true' && (needs.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/npm-publish.yml
    permissions:
      contents: read
      id-token: write
    with:
      tag: ${{ needs.release.outputs.tag_name }}
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}

  # Tag majeur flottant (v1 → dernière v1.x.y) pour `uses: …/repogarde@v1`
  tag-major:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Déplacer le tag majeur
        env:
          TAG: ${{ needs.release.outputs.tag_name }}
          MAJOR: v${{ needs.release.outputs.major }}
        run: |
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "refs/tags/$MAJOR"

  # Archive source signée (Sigstore, sans clé) jointe à la release :
  # vérifiable avec `cosign verify-blob` (voir SECURITY.md)
  sign:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      hashes: ${{ steps.archive.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Archive signée
        id: archive
        env:
          TAG: ${{ needs.release.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          name="repogarde-$TAG"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "$TAG"
          cosign sign-blob --yes --bundle "$name.tar.gz.sigstore.json" "$name.tar.gz"
          gh release upload "$TAG" "$name.tar.gz" "$name.tar.gz.sigstore.json" --clobber
          # Empreinte de l'archive pour la preuve de provenance SLSA
          echo "hashes=$(sha256sum "$name.tar.gz" | base64 -w0)" >>"$GITHUB_OUTPUT"

  # Provenance SLSA niveau 3 : atteste que l'archive a été construite par ce
  # workflow, depuis ce dépôt et ce commit (fichier .intoto.jsonl joint à la
  # release). Générateur référencé par tag : exigé par l'outil, qui vérifie sa
  # propre identité.
  provenance:
    needs: [release, sign]
    if: needs.release.outputs.release_created == 'true'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.sign.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.release.outputs.tag_name }}
      provenance-name: repogarde-${{ needs.release.outputs.tag_name }}.intoto.jsonl
