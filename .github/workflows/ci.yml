name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck ci/*.sh hooks/pre-commit hooks/prepare-commit-msg hooks/commit-msg hooks/pre-push hooks/post-checkout hooks/lib/*.sh hooks/lang/*.sh install.sh .lefthook/*/githooks

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Installer bats, lefthook, ruff, gitleaks
        env:
          GITHOOKS_BIN: ${{ runner.temp }}/bin
        run: |
          npm install -g bats lefthook
          pip install ruff
          ci/install-gitleaks.sh
          echo "$GITHOOKS_BIN" >>"$GITHUB_PATH"
      - name: Tests
        env:
          BATS_TEST_TIMEOUT: "300" # une boucle infinie échoue au lieu de bloquer la CI
        run: bats --print-output-on-failure test/

  # githooks se vérifie avec sa propre action (dogfooding)
  githooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          strict: true
