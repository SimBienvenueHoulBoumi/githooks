# Suivi des tickets, réutilisable par tout projet (sans clé ni jeton) :
#
#   on:
#     pull_request_target:
#       types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft, closed]
#     issues:
#       types: [opened, labeled]
#   jobs:
#     tickets:
#       uses: SimBienvenueHoulBoumi/repogarde/.github/workflows/tickets.yml@v3
#       permissions: { issues: write, pull-requests: write, statuses: write }
#
# et, dans release.yml, après une release ou une préversion :
#
#     tickets:
#       needs: release
#       if: needs.release.outputs.release_created == 'true' || needs.release.outputs.prerelease_created == 'true'
#       uses: SimBienvenueHoulBoumi/repogarde/.github/workflows/tickets.yml@v3
#       permissions: { issues: write, pull-requests: write, statuses: write }
#       with:
#         tag: ${{ needs.release.outputs.tag_name || needs.release.outputs.prerelease_tag }}
#
# Chaque PR doit citer un ticket validé (« Ticket : #12 », ou branche feat/12-…),
# sinon le ticket est créé « à valider » et la vérification « ticket » échoue
# jusqu'à ce qu'un mainteneur pose l'étiquette « validé ». Statuts suivis :
# à valider → backlog → en cours → en relecture → préprod → done.
# pull_request_target : aucun code de la PR n'est récupéré ni exécuté (API seule),
# les PR venant de forks peuvent donc être traitées en sécurité.
name: tickets

on:
  workflow_call:
    inputs:
      tag:
        description: Release ou préversion publiée (vX.Y.Z, vX.Y.Z-next.N) ; vide hors release
        type: string
        default: ""
      integration-branch:
        description: Branche d'intégration (ses PR de livraison n'exigent pas de ticket)
        type: string
        default: develop
      repogarde-ref:
        description: Version de repogarde dont les scripts sont utilisés
        type: string
        default: v3

permissions: {}

jobs:
  tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write # tickets : création, statuts, commentaires, fermeture
      pull-requests: write # lien du ticket dans la description de la PR
      statuses: write # vérification « ticket » de la PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SimBienvenueHoulBoumi/repogarde
          ref: ${{ inputs.repogarde-ref }}
          path: .repogarde-ci
          persist-credentials: false
      - name: Tickets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
          INTEGRATION: ${{ inputs.integration-branch }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          MERGED: ${{ github.event.pull_request.merged }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ISSUE: ${{ github.event.issue.number }}
          LABEL: ${{ github.event.label.name }}
        run: |
          if [ -n "$TAG" ]; then
            bash .repogarde-ci/ci/tickets.sh release
          elif [ "$EVENT" = issues ]; then
            bash .repogarde-ci/ci/tickets.sh issue
          else
            bash .repogarde-ci/ci/tickets.sh pr
          fi
