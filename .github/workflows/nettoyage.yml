# Branches de PR supprimées après merge (la suppression automatique de GitHub
# est désactivée dans le cycle develop → main : elle supprimait develop au
# merge de la livraison). main, develop et toute branche encore source d'une
# PR ouverte sont conservées.
name: nettoyage

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  nettoyage:
    uses: ./.github/workflows/nettoyage-branches.yml
    permissions:
      contents: write
      pull-requests: read
