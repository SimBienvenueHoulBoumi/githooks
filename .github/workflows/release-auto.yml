# Releases automatiques, réutilisables par tout projet (sans jeton personnel) :
#
#   jobs:
#     release:
#       uses: SimBienvenueHoulBoumi/repogarde/.github/workflows/release-auto.yml@v3
#       permissions: { contents: write, pull-requests: write, actions: write, checks: read, statuses: write }
#
# 1. release-please tient à jour une PR "release x.y.z" : version calculée
#    depuis les Conventional Commits, changelog, fichier de version du projet ;
# 2. la CI du projet est déclenchée sur cette PR (workflow_dispatch : seul type
#    d'événement que GITHUB_TOKEN a le droit de déclencher), son résultat réel
#    est reporté en statuts sur le commit, puis la PR est mergée (squash) ;
# 3. release-please, relancé, crée le tag vX.Y.Z et la release GitHub.
# Mode « tag » (flux develop → main, entrée mode: tag) : aucune PR de release
# ni fichier de version. Sur la branche d'intégration, une PR de livraison
# develop → main est tenue à jour (titre « chore(release): vX.Y.Z », notes) ;
# la merger (humain) publie : sur main, tag vX.Y.Z et release GitHub.
# Les sorties (release_created, tag_name, version…) permettent au projet
# d'enchaîner ses propres jobs de publication (registre, image, paquet…).
name: release-auto

on:
  workflow_call:
    inputs:
      release-type:
        description: >-
          Type release-please (maven, node, python, rust, go, helm, simple…).
          Vide : release-please-config.json du projet s'il existe, sinon
          détection d'après les fichiers à la racine.
        type: string
        default: ""
      workflows:
        description: >-
          Workflows de CI à lancer sur la PR de release (noms de fichiers séparés
          par des espaces). Vide : ceux qui réagissent à la fois à pull_request
          et à workflow_dispatch.
        type: string
        default: ""
      initial-version:
        description: Version de la toute première release (aucun tag ni release existant).
        type: string
        default: 0.1.0
      merge-auto:
        description: >-
          Mode pr : merger la PR de release une fois la CI verte. false : la PR
          est préparée et validée, un humain la merge (et une relecture exigée
          par la protection de la branche est toujours respectée).
        type: boolean
        default: true
      mode:
        description: >-
          « pr » (défaut) : release-please, PR de release mergée automatiquement.
          « tag » : flux develop → main, version calculée et tag posé au merge sur main.
        type: string
        default: pr
      integration-branch:
        description: "Mode tag : branche d'intégration"
        type: string
        default: develop
      main-branch:
        description: "Mode tag : branche des releases"
        type: string
        default: main
      repogarde-ref:
        description: "Mode tag : version de repogarde utilisée pour calculer la version"
        type: string
        # Version majeure courante, à changer à la main à chaque majeure : la
        # release ne modifie aucun fichier de .github/workflows/ (le jeton des
        # Actions n'en a pas le droit)
        default: v3
      notify:
        description: >-
          Événements envoyés au canal de l'équipe (secret webhook) : release
          (publiée), attente (PR de release à approuver), echec (workflow en échec).
        type: string
        default: release attente echec
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json
    secrets:
      webhook:
        description: Adresse du webhook entrant du canal de l'équipe (Slack, Teams, Discord…)
        required: false
      app-id:
        description: >-
          Bot de release (optionnel) : identifiant d'une GitHub App installée sur
          le dépôt (Contents, Pull requests, Workflows, Issues en écriture). Ses
          jetons d'une heure remplacent le jeton des Actions pour créer la PR de
          release et la release : aucun blocage si des workflows ont changé.
          Configuration guidée : repogarde/bin/bot-release.
        required: false
      app-key:
        description: Clé privée (PEM) de cette GitHub App
        required: false
    outputs:
      release_created:
        value: ${{ jobs.release.outputs.release_created || jobs.tag.outputs.release_created }}
      tag_name:
        value: ${{ jobs.release.outputs.tag_name || jobs.tag.outputs.tag_name }}
      version:
        value: ${{ jobs.release.outputs.version || jobs.tag.outputs.version }}
      major:
        value: ${{ jobs.release.outputs.major || jobs.tag.outputs.major }}
      sha:
        value: ${{ jobs.release.outputs.sha || jobs.tag.outputs.sha }}

permissions: {}

jobs:
  release:
    if: inputs.mode != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      actions: write # déclencher la CI sur la PR de release, approuver ses runs
      checks: read
      statuses: write # reporter le résultat de cette CI sur le commit
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.publish.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.publish.outputs.tag_name }}
      version: ${{ steps.release.outputs.version || steps.publish.outputs.version }}
      major: ${{ steps.release.outputs.major || steps.publish.outputs.major }}
      sha: ${{ steps.release.outputs.sha || steps.publish.outputs.sha }}
      waiting_pr: ${{ steps.merge.outputs.waiting_pr }}
    env:
      HAS_APP: ${{ secrets.app-id != '' && secrets.app-key != '' }}
    steps:
      # Identité de release : bot GitHub App si configuré (jeton d'une heure),
      # sinon jeton des Actions
      - name: Bot de release
        id: bot
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-key }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-issues: write
      # Tout est lu par l'API : pas de checkout, aucun code du projet exécuté
      - name: Configuration
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TYPE: ${{ inputs.release-type }}
          CONFIG_FILE: ${{ inputs.config-file }}
          WORKFLOWS: ${{ inputs.workflows }}
          CALLER: ${{ github.workflow_ref }}
          INITIAL_VERSION: ${{ inputs.initial-version }}
        run: |
          existe() { gh api "repos/$GH_REPO/contents/$1?ref=$GITHUB_REF_NAME" --silent 2>/dev/null; }
          type="$RELEASE_TYPE"
          if [ -z "$type" ] && existe "$CONFIG_FILE"; then
            echo "Configuration : $CONFIG_FILE"
          elif [ -z "$type" ]; then
            # Fichier de version du projet, à la racine
            type=simple
            for paire in pom.xml:maven package.json:node pyproject.toml:python setup.py:python \
              Cargo.toml:rust Chart.yaml:helm go.mod:go composer.json:php pubspec.yaml:dart \
              mix.exs:elixir; do
              if existe "${paire%%:*}"; then type="${paire#*:}"; break; fi
            done
            echo "Type détecté : $type (fixer avec l'entrée release-type, ou $CONFIG_FILE)"
          fi
          echo "type=$type" >>"$GITHUB_OUTPUT"

          # Première release : version initiale choisie (release-please partirait de 1.0.0)
          if [ -z "$(gh release list --limit 1 --json tagName -q '.[].tagName')" ] &&
            [ "$(gh api "repos/$GH_REPO/tags?per_page=1" --jq length)" = 0 ]; then
            echo "Première release : $INITIAL_VERSION"
            echo "release_as=$INITIAL_VERSION" >>"$GITHUB_OUTPUT"
          fi

          if [ -z "$WORKFLOWS" ]; then
            appelant="${CALLER%%@*}"
            appelant="${appelant##*/}"
            for f in $(gh api "repos/$GH_REPO/contents/.github/workflows?ref=$GITHUB_REF_NAME" \
              --jq '.[] | select(.name | test("\\.ya?ml$")) | .name'); do
              [ "$f" = "$appelant" ] && continue
              contenu="$(gh api "repos/$GH_REPO/contents/.github/workflows/$f?ref=$GITHUB_REF_NAME" \
                --jq .content | base64 -d)"
              if grep -qw pull_request <<<"$contenu" && grep -qw workflow_dispatch <<<"$contenu"; then
                WORKFLOWS="$WORKFLOWS $f"
              fi
            done
          fi
          echo "Workflows de CI pour la PR de release :${WORKFLOWS:- aucun}"
          echo "workflows=$WORKFLOWS" >>"$GITHUB_OUTPUT"

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.bot.outputs.token || github.token }}
          release-type: ${{ steps.config.outputs.type }}
          release-as: ${{ steps.config.outputs.release_as }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      - name: CI sur la PR de release, puis merge
        id: merge
        # PR créée ou mise à jour par ce run, sinon PR déjà ouverte restée en
        # attente (release-please ne la renvoie que s'il la modifie)
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
          WORKFLOWS: ${{ steps.config.outputs.workflows }}
          MERGE_AUTO: ${{ inputs.merge-auto }}
        run: |
          # Erreurs 5xx passagères de l'API GitHub : nouvelles tentatives espacées
          reessayer() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "↻ échec ($i/5) : $*"
              sleep $((i * 15))
            done
            return 1
          }
          # Runs « pull_request » de la PR de release mis en attente d'approbation
          # (GitHub traite le bot comme un contributeur externe) : approuvés,
          # uniquement pour le commit exact de la branche de release
          approuver_runs() {
            gh api "repos/$GH_REPO/actions/runs?status=action_required&head_sha=$sha" \
              --jq '.workflow_runs[].id' | while IFS= read -r id; do
                gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null &&
                  echo "✔ run $id approuvé"
              done || true
          }
          if [ -n "$PR_JSON" ]; then
            pr="$(jq -r .number <<<"$PR_JSON")"
          else
            pr="$(gh pr list --state open --base "$GITHUB_REF_NAME" --label 'autorelease: pending' \
              --json number -q '.[0].number')"
          fi
          [ -n "$pr" ] || { echo "Aucune PR de release en attente"; exit 0; }
          branch="$(gh pr view "$pr" --json headRefName -q .headRefName)"
          # Commit lu sur la branche ; la PR peut l'afficher avec un léger
          # retard : on attend qu'elle suive (sinon --match-head-commit échoue)
          sha="$(gh api "repos/$GH_REPO/commits/$branch" --jq .sha)"
          for _ in $(seq 1 30); do
            [ "$(gh pr view "$pr" --json headRefOid -q .headRefOid)" = "$sha" ] && break
            sleep 5
          done
          echo "PR #$pr ($branch @ ${sha:0:7}) : CI"
          runs=""
          for wf in $WORKFLOWS; do
            reessayer gh workflow run "$wf" --ref "$branch"
          done
          for wf in $WORKFLOWS; do
            run_id=""
            for _ in $(seq 1 30); do
              run_id="$(gh run list --workflow "$wf" --branch "$branch" --event workflow_dispatch \
                --commit "$sha" --limit 1 --json databaseId -q '.[0].databaseId')"
              [ -n "$run_id" ] && break
              sleep 5
            done
            [ -n "$run_id" ] || { echo "✖ Run de $wf introuvable"; exit 1; }
            runs="$runs $run_id"
          done
          for id in $runs; do
            if ! gh run watch "$id" --exit-status --interval 30 >/dev/null; then
              # CI interrompue par un merge manuel (branche de release supprimée)
              [ "$(gh pr view "$pr" --json state -q .state)" != MERGED ] ||
                { echo "✔ PR #$pr mergée manuellement : la release est publiée par le run de ce merge"; exit 0; }
              echo "✖ CI en échec : $(gh run view "$id" --json url -q .url)"
              exit 1
            fi
          done
          # Vérifications exigées par la protection de la branche : résultat
          # réel de chacune (cherché dans les runs lancés), reporté en statut
          gh api "repos/$GH_REPO/rules/branches/$GITHUB_REF_NAME" \
            --jq '.[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context' |
            while IFS= read -r ctx; do
              conclusion="" url=""
              for id in $runs; do
                conclusion="$(gh run view "$id" --json jobs \
                  -q ".jobs[] | select(.name==\"$ctx\") | .conclusion")"
                [ -n "$conclusion" ] && { url="$(gh run view "$id" --json url -q .url)"; break; }
              done
              if [ "$conclusion" != success ]; then
                echo "✖ $ctx : ${conclusion:-absent des workflows lancés (entrée « workflows »)}"
                exit 1
              fi
              gh api "repos/$GH_REPO/statuses/$sha" -f state=success -f context="$ctx" \
                -f target_url="$url" -f description="CI de la PR de release" >/dev/null
              echo "✔ $ctx"
            done
          # D'autres vérifications peuvent aussi tourner sur la PR (workflows
          # pull_request) : on attend que GitHub la déclare mergeable (toutes
          # les vérifications terminées et vertes) ; sinon, pas de merge.
          for _ in $(seq 1 90); do
            # Mergée (ou fermée) par une personne entre-temps : son merge
            # relance ce workflow, qui publie la release ; rien d'autre à faire
            case "$(gh pr view "$pr" --json state -q .state)" in
              MERGED) echo "✔ PR #$pr mergée manuellement : la release est publiée par le run de ce merge"; exit 0 ;;
              CLOSED) echo "PR #$pr fermée sans merge : pas de release"; exit 0 ;;
            esac
            state="$(gh pr view "$pr" --json mergeStateStatus -q .mergeStateStatus)"
            case "$state" in
              CLEAN | BEHIND) break ;;
              BLOCKED | UNKNOWN | UNSTABLE)
                # Relecture humaine exigée : la PR attend son approbation
                case "$(gh pr view "$pr" --json reviewDecision -q .reviewDecision)" in
                  REVIEW_REQUIRED | CHANGES_REQUESTED)
                    echo "::notice::PR #$pr validée par la CI, en attente d'approbation humaine : son merge publiera la release."
                    echo "waiting_pr=$pr" >>"$GITHUB_OUTPUT"
                    exit 0
                    ;;
                esac
                approuver_runs
                sleep 30
                ;;
              *) echo "✖ PR #$pr non mergeable : $state"; exit 1 ;;
            esac
          done
          # La branche a avancé pendant la CI : version et changelog sont à
          # recalculer (un simple « update branch » publierait les nouveaux
          # commits sous l'ancienne version). Le run déclenché par ce push
          # régénère la PR ; s'il n'y en a pas (push du jeton des Actions), on
          # le lance.
          if [ "$state" = BEHIND ]; then
            wf="${GITHUB_WORKFLOW_REF#*/.github/workflows/}"
            wf="${wf%%@*}"
            suivant="$(gh run list --workflow "$wf" --branch "$GITHUB_REF_NAME" --limit 20 --json databaseId,status \
              -q "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length")"
            [ "${suivant:-0}" != 0 ] || reessayer gh workflow run "$wf" --ref "$GITHUB_REF_NAME"
            echo "::notice::$GITHUB_REF_NAME a avancé pendant la CI : la PR #$pr est recalculée par le run suivant."
            exit 0
          fi
          [ "$state" = CLEAN ] || { echo "✖ PR #$pr toujours $state après 45 min"; exit 1; }
          if [ "$MERGE_AUTO" != true ]; then
            echo "::notice::PR #$pr validée par la CI, à merger par un humain (merge-auto: false) : son merge publiera la release."
            echo "waiting_pr=$pr" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          reessayer gh pr merge "$pr" --squash --match-head-commit "$sha"
          echo "merged=true" >>"$GITHUB_OUTPUT"
          exit 0

      # Le merge fait par GITHUB_TOKEN ne relance pas le workflow : on publie ici
      - id: publish
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.bot.outputs.token || github.token }}
          release-type: ${{ steps.config.outputs.type }}
          release-as: ${{ steps.config.outputs.release_as }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          skip-github-pull-request: true

      - name: Aide
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat <<'EOF'
          ::notice::Si release-please indique « GitHub Actions is not permitted to create or approve pull requests » :
          Settings → Actions → General → Workflow permissions → cocher « Allow GitHub Actions to create and approve pull requests ».
          EOF
          # PR de release mergée mais pas publiée, dont les workflows diffèrent
          # de la branche actuelle : GitHub exige la permission « workflow »
          # pour créer son tag, que le jeton des Actions n'a jamais (refus
          # « Resource not accessible by integration »). Cas d'une PR de release
          # mergée à la main, suivie d'un changement de workflow avant la release.
          pr="$(gh pr list --state merged --base "$GITHUB_REF_NAME" --label 'autorelease: pending' \
            --json number,title,mergeCommit -q '.[0] // empty' 2>/dev/null || true)"
          [ -n "$pr" ] || exit 0
          num="$(jq -r .number <<<"$pr")"
          title="$(jq -r .title <<<"$pr")"
          sha="$(jq -r .mergeCommit.oid <<<"$pr")"
          version="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ ]*' <<<"$title" | head -n1)"
          changed="$(gh api "repos/$GH_REPO/compare/$sha...$GITHUB_SHA" \
            --jq '[.files[]?.filename | select(startswith(".github/workflows/"))] | join(" ")' 2>/dev/null || true)"
          [ -n "$changed" ] || exit 0
          echo "::error title=Release bloquée::La PR de release #$num ($title) est mergée mais son tag ne peut pas être créé par le jeton des Actions : les workflows ont changé depuis ($changed). GitHub exige la permission « workflow »."
          cat <<EOF
          Débloquer (une fois, avec un compte qui a la permission « workflow ») :
            gh auth refresh -h github.com -s workflow
            gh pr view $num -R $GH_REPO --json body -q .body > notes.md   # notes de version
            gh release create v$version -R $GH_REPO --target $sha --title v$version --notes-file notes.md
            gh pr edit $num -R $GH_REPO --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          puis relancer ce workflow. Pour l'éviter : laisser le bot merger la PR de release (il publie aussitôt),
          ou configurer un bot de release (GitHub App, jamais bloqué) : repogarde/bin/bot-release
          EOF

  # Mode tag : flux develop → main
  tag:
    if: inputs.mode == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag et release
      pull-requests: write # PR de livraison
    outputs:
      release_created: ${{ steps.publier.outputs.release_created }}
      tag_name: ${{ steps.publier.outputs.tag_name }}
      version: ${{ steps.publier.outputs.version }}
      major: ${{ steps.publier.outputs.major }}
      sha: ${{ steps.publier.outputs.sha }}
    env:
      HAS_APP: ${{ secrets.app-id != '' && secrets.app-key != '' }}
    steps:
      # Identité de release : bot GitHub App si configuré (jeton d'une heure),
      # sinon jeton des Actions
      - name: Bot de release
        id: bot
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-key }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-issues: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags et historique : calcul de version
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SimBienvenueHoulBoumi/repogarde
          ref: ${{ inputs.repogarde-ref }}
          path: .repogarde-ci
          persist-credentials: false

      - name: PR de livraison
        if: github.ref_name == inputs.integration-branch
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          INTEGRATION: ${{ inputs.integration-branch }}
          MAIN: ${{ inputs.main-branch }}
          INITIAL_VERSION: ${{ inputs.initial-version }}
        run: |
          git fetch -q origin "$MAIN"
          pr="$(gh pr list --head "$INTEGRATION" --base "$MAIN" --state open --json number -q '.[0].number // empty')"
          if [ -z "$(git log --oneline "origin/$MAIN..HEAD")" ]; then
            echo "$INTEGRATION ne contient rien de plus que $MAIN : pas de livraison."
            exit 0
          fi
          version="$(bash .repogarde-ci/ci/version.sh next HEAD)"
          if [ -n "$version" ]; then
            title="chore(release): v$version"
            body="$(printf 'Merger cette PR (merge commit) publie **v%s** : tag et release GitHub automatiques.\n\n%s\n\n---\n_Tenue à jour à chaque merge sur %s (repogarde)._\n' \
              "$version" "$(bash .repogarde-ci/ci/version.sh notes HEAD)" "$INTEGRATION")"
          else
            title="chore(release): livrer $INTEGRATION sur $MAIN"
            body="Aucune nouvelle version : maintenance uniquement (ci, chore, docs…)."
          fi
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body "$body" >/dev/null
            echo "::notice::PR #$pr : $title"
          else
            gh pr create --head "$INTEGRATION" --base "$MAIN" --title "$title" --body "$body"
            echo "::notice::PR de livraison créée : $title"
          fi

      - name: Tag et release
        id: publier
        if: github.ref_name == inputs.main-branch
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          INITIAL_VERSION: ${{ inputs.initial-version }}
        run: |
          version="$(bash .repogarde-ci/ci/version.sh next HEAD)"
          if [ -z "$version" ]; then
            echo "Rien à publier."
            exit 0
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::warning::$tag existe déjà : rien à faire."
            exit 0
          fi
          bash .repogarde-ci/ci/version.sh notes HEAD >"$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          {
            echo "release_created=true"
            echo "tag_name=$tag"
            echo "version=$version"
            echo "major=${version%%.*}"
            echo "sha=$GITHUB_SHA"
          } >>"$GITHUB_OUTPUT"

  # Canal de l'équipe (optionnel) : release publiée, PR de release à approuver,
  # échec. Sans secret webhook, rien n'est envoyé. Message dans la langue du projet.
  notifier:
    needs: [release, tag]
    if: always() && !cancelled()
    # Une notification ne fait jamais échouer une release (ni sauter ses suites)
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .repogarde.conf # langue du projet
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SimBienvenueHoulBoumi/repogarde
          ref: ${{ inputs.repogarde-ref }}
          path: .repogarde-ci
          persist-credentials: false
      - name: Notifier
        env:
          REPOGARDE_WEBHOOK: ${{ secrets.webhook }}
          EVENTS: ${{ inputs.notify }}
          CREATED: ${{ needs.release.outputs.release_created || needs.tag.outputs.release_created }}
          TAG: ${{ needs.release.outputs.tag_name || needs.tag.outputs.tag_name }}
          WAITING: ${{ needs.release.outputs.waiting_pr }}
          FAILED: ${{ needs.release.result == 'failure' || needs.tag.result == 'failure' }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          REPOGARDE_REF: ${{ inputs.repogarde-ref }}
        run: |
          # Version de repogarde sans notifications (ancien tag) : rien à faire
          [ -f .repogarde-ci/ci/notifier.sh ] || { echo "notifier.sh absent de $REPOGARDE_REF : ignoré"; exit 0; }
          notifier() { bash .repogarde-ci/ci/notifier.sh "$@"; }
          a_notifier() { [[ " $EVENTS " == *" $1 "* ]]; }
          if [ "$FAILED" = true ] && a_notifier echec; then
            notifier ci.notify.failure "$REPO" "$SERVER/$REPO/actions/runs/$RUN_ID"
          elif [ "$CREATED" = true ] && a_notifier release; then
            notifier ci.notify.released "$REPO" "$TAG" "$SERVER/$REPO/releases/tag/$TAG"
          elif [ -n "$WAITING" ] && a_notifier attente; then
            notifier ci.notify.waiting "$REPO" "$WAITING" "$SERVER/$REPO/pull/$WAITING"
          fi
