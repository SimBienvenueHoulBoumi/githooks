# Mises à jour des actions GitHub (figées par SHA) ; messages Conventional
# Commits pour passer la vérification repowarden.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # Outils Python de la CI et du site, figés par empreinte (pip-compile)
  - package-ecosystem: pip
    directories: [/docs, /ci/requirements]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]
