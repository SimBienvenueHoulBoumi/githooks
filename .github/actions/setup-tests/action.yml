# Outillage des tests bats (partagé par les jobs Linux, macOS et Windows)
name: setup-tests
description: Installe go, node, python, bats, lefthook, ruff et gitleaks
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24 # version présente sur les runners : pas de téléchargement de la liste des versions (alias lts/* fragile)
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.x"
    - name: Installer bats, lefthook, ruff, gitleaks
      shell: bash
      env:
        REPOGARDE_BIN: ${{ runner.temp }}/bin
      run: |
        npm install -g bats@1.13.0 lefthook@2.1.17
        pip install --require-hashes -r ci/requirements/tests.txt
        ci/install-tool.sh gitleaks
        echo "$REPOGARDE_BIN" >>"$GITHUB_PATH"
