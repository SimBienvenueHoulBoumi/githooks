# Réglages repogarde de ce dépôt (appliqués aux hooks et à la CI)
[repogarde]
    # Cycle de livraison : le travail s'intègre dans develop, main ne reçoit
    # que les livraisons (PR develop → main) et les correctifs urgents (hotfix/*)
    integrationBranch = develop
    protectedBranches = main develop
    # Branches longues, et branches de PR de release-please et Dependabot
    allowedBranches = main develop release-please--* dependabot/*
    # Projets exemples des tests e2e : volontairement mal formatés / cassés
    exclude = test/e2e/*
    # package.json ne sert qu'à publier le paquet npm : pas un projet Node
    skip = node
